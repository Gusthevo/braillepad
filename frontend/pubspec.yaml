name: braillepad_frontend
description: "Interactive Canvas and Braillepad Flutter Frontend"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  shared_preferences: ^2.2.2
  # BLE: fixar versoes para estabilizar a integracao.
  flutter_blue_plus: 2.3.15
  permission_handler: 12.0.1
  device_info_plus: 11.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

